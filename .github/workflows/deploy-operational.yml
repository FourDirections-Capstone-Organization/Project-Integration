name: Deploy Operational System

on:
  push:
    branches: [main]
    paths:
      - 'operational-system/**'
      - '.github/workflows/deploy-operational.yml'

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME || 'crudregistry2026' }}.azurecr.io
  AZURE_REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME || 'crudregistry2026' }}
  BACKEND_IMAGE_NAME: operational-backend
  AZURE_CONTAINER_APP_NAME: operational-backend
  AZURE_RESOURCE_GROUP: crud-app
  FRONTEND_PATH: operational-system/operational-frontend

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.AZURE_REGISTRY_NAME }}

      - name: Build and push Operational Docker image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} ./operational-system/OperationalSystem.Api
          docker tag ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          docker push --all-tags ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}

      - name: Configure ACR credentials on Container App
        run: |
          az containerapp registry set --name ${{ env.AZURE_CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --server ${{ env.AZURE_CONTAINER_REGISTRY }} --username ${{ secrets.AZURE_REGISTRY_USERNAME }} --password ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update --name ${{ env.AZURE_CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --image ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel@latest --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_OPERATIONAL }}
